name: khushu
base: core24
version: "1.3.4"
title: Khushu
summary: An all-in-one Muslim app for Linux
description: |
  Khushu is your all-in-one Muslim app for Linux desktop, tablets, and smartphones.
  It centralizes your daily worship by providing accurate prayer times, native staggered Adkar notifications, and a dedicated Noble Quran reader—all with uncompromising privacy and zero telemetry.
license: GPL-3.0-or-later
website: https://github.com/sniper1720/khushu
issues: https://github.com/sniper1720/khushu/issues
contact: sniper1720@linuxtechmore.com
source-code: https://github.com/sniper1720/khushu
donation: https://github.com/sponsors/sniper1720

grade: stable
confinement: strict
icon: data/icons/hicolor/scalable/apps/io.github.sniper1720.khushu.svg

slots:
  dbus-khushu:
    interface: dbus
    bus: session
    name: io.github.sniper1720.khushu

apps:
  khushu:
    command: usr/bin/khushu
    desktop: usr/share/applications/io.github.sniper1720.khushu.desktop
    autostart: io.github.sniper1720.khushu.desktop
    common-id: io.github.sniper1720.khushu
    extensions: [gnome]
    plugs:
      - network
      - audio-playback
      - unity7
    slots:
      - dbus-khushu

layout:
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa
  /etc/asound.conf:
    bind-file: $SNAP/assets/asound.conf

parts:
  khushu:
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --wrap-mode=nofallback
    source: .
    build-snaps:
      - rustup
    build-packages:
      - gettext
      - build-essential
      - pkg-config
      - libssl-dev
      - libasound2-dev
      - libgtk-4-dev
      - libadwaita-1-dev
    stage-packages:
      - libasound2t64
      - libpulse0
      - libasound2-plugins
    build-environment:
      - PATH: /usr/local/bin:${PATH:-}
    override-build: |
      unset LD_LIBRARY_PATH
      rustup default stable
      CARGO_PATH="$(rustup which cargo)"
      RUSTC_PATH="$(rustup which rustc)"
      # Cargo wrapper: clears LD_LIBRARY_PATH so GNOME SDK's libc
      # doesn't conflict with the Rust toolchain's cargo binary
      printf '#!/bin/sh\nunset LD_LIBRARY_PATH\nexec %s "$@"\n' "$CARGO_PATH" > /usr/local/bin/cargo
      chmod +x /usr/local/bin/cargo
      ln -sf "$RUSTC_PATH" /usr/local/bin/rustc
      # glib-compile-resources wrapper: restores LD_LIBRARY_PATH so
      # cargo's build.rs (glib-build-tools) can find GNOME SDK's GLib
      printf '#!/bin/sh\nexport LD_LIBRARY_PATH="/snap/gnome-46-2404-sdk/current/lib/%s:/snap/gnome-46-2404-sdk/current/usr/lib/%s:/snap/gnome-46-2404-sdk/current/usr/lib"\nexec /snap/gnome-46-2404-sdk/current/usr/bin/glib-compile-resources "$@"\n' "$CRAFT_ARCH_TRIPLET_BUILD_FOR" "$CRAFT_ARCH_TRIPLET_BUILD_FOR" > /usr/local/bin/glib-compile-resources
      chmod +x /usr/local/bin/glib-compile-resources
      # Force meson reconfigure to pick up our cargo wrapper
      rm -rf "$CRAFT_PART_BUILD"
      mkdir -p "$CRAFT_PART_BUILD"
      craftctl default

      # --- Fix GNOME Library Conflicts ---
      rm -f $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libharfbuzz*.so*
      rm -f $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpango*.so*
      rm -f $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/librsvg*.so*

      # --- ALSA config ---
      mkdir -p $CRAFT_PART_INSTALL/assets
      echo -e "pcm.!default { type pulse }\nctl.!default { type pulse }" > $CRAFT_PART_INSTALL/assets/asound.conf

      # --- Locale files ---
      for lang in ar fr es tr; do
        merged_src="$CRAFT_PROJECT_DIR/target/locale/$lang/LC_MESSAGES"
        dest_dir="$CRAFT_PART_INSTALL/usr/share/khushu/locale/$lang/LC_MESSAGES"
        if [ -d "$merged_src" ]; then
          mkdir -p "$dest_dir"
          cp -f "$merged_src"/*.mo "$dest_dir/" 2>/dev/null || true
        fi
      done

      # --- Icon fallback (prevent "..." tray icon in snap) ---
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/symbolic/apps/io.github.sniper1720.khushu-symbolic.svg $CRAFT_PART_INSTALL/meta/gui/io.github.sniper1720.khushu-symbolic.svg
